name: 部署后端

on:
  workflow_dispatch:
  push:
    branches: [ master ]
    paths:
      - 'ruoyi-admin/**'
      - 'ruoyi-framework/**'
      - 'ruoyi-system/**'
      - 'ruoyi-common/**'
      - 'ruoyi-quartz/**'
      - 'ruoyi-generator/**'
      - 'scripts/deploy/**'
      - '.github/workflows/deploy-backend.yml'
      - 'pom.xml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    concurrency: deploy-backend

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 打包后端源码
        run: |
          tar -czf fund-supervision-src.tgz \
            --exclude='*/target' \
            --exclude='.git' \
            pom.xml META-INF ruoyi-admin ruoyi-common ruoyi-framework \
            ruoyi-system ruoyi-quartz ruoyi-generator scripts/deploy

      - name: 上传源码包
        uses: easingthemes/ssh-deploy@v5.0.2
        with:
          SSH_PRIVATE_KEY: ${{ secrets.SERVER_SSH_KEY }}
          REMOTE_HOST: ${{ secrets.SERVER_HOST }}
          REMOTE_USER: ${{ secrets.SERVER_USER }}
          REMOTE_PORT: ${{ secrets.SERVER_PORT }}
          SOURCE: fund-supervision-src.tgz
          TARGET: /tmp/fund-supervision-release/
          ARGS: -rlgoDzvc --no-perms

      - name: 服务器构建并重启
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          envs: GITHUB_SHA
          script: |
            set -euo pipefail
            BASE=/opt/fund-supervision
            SRC="$BASE/src"
            JAR="$SRC/ruoyi-admin/target/ruoyi-admin.jar"
            FIX_DIR="$SRC/ruoyi-admin/target/logback-fix/BOOT-INF/classes"
            tar -xzf /tmp/fund-supervision-release/fund-supervision-src.tgz -C "$SRC"
            echo "$GITHUB_SHA" > "$SRC/.deployed-commit"
            cd "$SRC"
            mvn -q install:install-file -Dfile=ruoyi-admin/src/main/webapp/WEB-INF/lib/szzz-open-gateway-sdk-1.0-SNAPSHOT.jar -DpomFile=META-INF/maven/com.digital.szzz/szzz-open-gateway-sdk/pom.xml
            mvn -q clean package -pl ruoyi-admin -am -DskipTests
            mkdir -p "$FIX_DIR"
            cp "$BASE/logback.xml" "$FIX_DIR/logback.xml"
            jar uf "$JAR" -C "$SRC/ruoyi-admin/target/logback-fix" BOOT-INF/classes/logback.xml
            rm -rf "$SRC/ruoyi-admin/target/logback-fix"
            cp "$JAR" "$BASE/app/ruoyi-admin.jar"
            bash "$BASE/deploy.sh"
          command_timeout: 45m
