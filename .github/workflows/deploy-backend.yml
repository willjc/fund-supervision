name: 部署后端

on:
  workflow_dispatch:
  push:
    branches: [ master ]
    paths:
      - 'ruoyi-admin/**'
      - 'ruoyi-framework/**'
      - 'ruoyi-system/**'
      - 'ruoyi-common/**'
      - 'ruoyi-quartz/**'
      - 'ruoyi-generator/**'
      - 'scripts/deploy/**'
      - '.github/workflows/deploy-backend.yml'
      - 'pom.xml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    concurrency: deploy-backend

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 设置 Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: 构建后端
        run: |
          mvn -B -q install:install-file \
            -Dfile=ruoyi-admin/src/main/webapp/WEB-INF/lib/szzz-open-gateway-sdk-1.0-SNAPSHOT.jar \
            -DpomFile=META-INF/maven/com.digital.szzz/szzz-open-gateway-sdk/pom.xml
          mvn -B -q clean package -pl ruoyi-admin -am -DskipTests

      - name: 上传运行包
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          source: ruoyi-admin/target/ruoyi-admin.jar
          target: /tmp/fund-supervision-release
          strip_components: 2

      - name: 替换运行包并重启
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          script: |
            set -euo pipefail
            BASE=/opt/fund-supervision
            JAR=/tmp/fund-supervision-release/ruoyi-admin.jar
            test -s "$JAR"
            cp "$BASE/app/ruoyi-admin.jar" "$BASE/app/ruoyi-admin.before-$(date +%Y%m%d%H%M%S).jar"
            mkdir -p /tmp/fund-supervision-logback/BOOT-INF/classes
            cp "$BASE/logback.xml" /tmp/fund-supervision-logback/BOOT-INF/classes/logback.xml
            jar uf "$JAR" -C /tmp/fund-supervision-logback BOOT-INF/classes/logback.xml
            cp "$JAR" "$BASE/app/ruoyi-admin.jar"
            bash "$BASE/deploy.sh"
          command_timeout: 45m
