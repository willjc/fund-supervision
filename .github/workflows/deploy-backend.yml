name: 部署后端

on:
  workflow_dispatch:
  push:
    branches: [ master ]
    paths:
      - 'ruoyi-admin/**'
      - 'ruoyi-framework/**'
      - 'ruoyi-system/**'
      - 'ruoyi-common/**'
      - 'ruoyi-quartz/**'
      - 'ruoyi-generator/**'
      - 'scripts/deploy/**'
      - 'pom.xml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    concurrency: deploy-backend

    steps:
      - name: 在服务器上拉取代码、构建并部署
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          script: bash /opt/fund-supervision/src/scripts/deploy/ci-backend.sh
          command_timeout: 45m
