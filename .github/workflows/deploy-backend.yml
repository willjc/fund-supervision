name: 部署后端

on:
  workflow_dispatch:
  push:
    branches: [ master ]
    paths:
      - 'ruoyi-admin/**'
      - 'ruoyi-framework/**'
      - 'ruoyi-system/**'
      - 'ruoyi-common/**'
      - 'ruoyi-quartz/**'
      - 'ruoyi-generator/**'
      - 'pom.xml'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    concurrency: deploy-backend

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 设置 JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: 安装本地 SDK
        run: mvn -q install:install-file \
          -Dfile=ruoyi-admin/src/main/webapp/WEB-INF/lib/szzz-open-gateway-sdk-1.0-SNAPSHOT.jar \
          -DpomFile=META-INF/maven/com.digital.szzz/szzz-open-gateway-sdk/pom.xml

      - name: Maven 构建
        run: mvn -q clean package -pl ruoyi-admin -am -DskipTests

      - name: 上传 JAR 到服务器
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          source: ruoyi-admin/target/ruoyi-admin.jar
          target: /opt/fund-supervision/app/
          strip_components: 2

      - name: SSH 重启服务
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          script: bash /opt/fund-supervision/deploy.sh
